services:
  # Web Uygulaması (Nostr Second Brain)
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Self-Hosted Private Relay (strfry v1.1.3)
  private-relay:
    image: ghcr.io/hoytech/strfry:latest
    ports:
      - "7777:7777"
    volumes:
      - ./strfry-data:/app/strfry-db
      - ./strfry.conf:/etc/strfry.conf
    command: ["strfry", "relay"]
    restart: unless-stopped
