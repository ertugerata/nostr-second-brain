name: Build and Push Docker Image on Release/Tag

on:
  push:
    # Sadece 'v' ile başlayan etiketler push edildiğinde tetiklenir (Örn: v1.0.0, v2.1.3)
    tags:
      - 'v*.*.*'
  release:
    # GitHub üzerinde bir Release oluşturulduğunda veya yayınlandığında tetiklenir
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository'yi Klonla
        uses: actions/checkout@v5

      - name: Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v4

      - name: GHCR'a Giriş Yap
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Etiket ve Format Metadatalarını Oluştur
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # SemVer standartında etiketler üretir (Örn: v1.0.0, v1.0, v1)
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            # En son yayınlanan sürüm için 'latest' etiketi koyar
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Docker İmajını Derle ve Push Et
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
